<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veo Studio — AI Video Generator</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">✦</span>
      <span>Veo Studio</span>
    </div>
    <span class="badge">Gemini + Veo</span>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">AI VIDEO GENERATOR</p>
      <h1>أنشئ فيديو بالذكاء الاصطناعي</h1>
      <p class="subtitle">اكتب فكرتك، اختر المقاس، ويمكنك إضافة صورة كبداية للمشهد.</p>
    </section>

    <section class="card">
      <form id="videoForm">
        <label for="prompt">وصف الفيديو</label>
        <textarea id="prompt" name="prompt" maxlength="5000"
          placeholder="مثال: لقطة سينمائية لمدينة القاهرة ليلًا، أضواء السيارات تنعكس على الشوارع بعد المطر، حركة كاميرا بطيئة وصوت أجواء المدينة..."></textarea>

        <div class="grid">
          <div>
            <label for="aspectRatio">نسبة الفيديو</label>
            <select id="aspectRatio" name="aspectRatio">
              <option value="9:16">9:16 — عمودي</option>
              <option value="16:9">16:9 — أفقي</option>
            </select>
          </div>
          <div>
            <label>النموذج</label>
            <div class="modelBox">Veo 3.1 Fast</div>
          </div>
        </div>

        <label for="image">صورة مرجعية <span>(اختياري)</span></label>
        <input id="image" name="image" type="file" accept="image/png,image/jpeg,image/webp">

        <button id="generateBtn" type="submit">
          <span id="btnText">إنشاء الفيديو</span>
          <span id="spinner" class="spinner hidden"></span>
        </button>
      </form>

      <div id="status" class="status hidden"></div>

      <section id="result" class="result hidden">
        <h2>الفيديو جاهز 🎬</h2>
        <video id="video" controls playsinline></video>
        <a id="download" class="download" download="ai-video.mp4">تحميل الفيديو</a>
      </section>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
